name: Build iOS IPA (unsigned)

# Chay tay tu tab Actions, hoac tu dong khi push len nhanh main.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cai dependencies
        run: |
          rm -f package-lock.json
          npm install
          echo "===== kiem tra plugin co mat khong ====="
          for p in expo-notifications expo-image-picker expo-audio expo-video; do
            if [ -d "node_modules/$p" ]; then echo "OK  $p"; else echo "THIEU  $p"; fi
          done

      - name: Expo prebuild (tao thu muc ios)
        run: npx expo prebuild --platform ios --no-install

      - name: Pod install
        run: |
          cd ios
          pod install

      - name: Doc ten scheme/workspace
        id: xc
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -n1)
          SCHEME="${WS%.xcworkspace}"
          echo "workspace=$WS" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "Workspace=$WS  Scheme=$SCHEME"

      - name: Build archive (KHONG ky - unsigned)
        run: |
          cd ios
          xcodebuild \
            -workspace "${{ steps.xc.outputs.workspace }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Dong goi thanh file .ipa
        run: |
          cd ios/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -qry ZaloFake-unsigned.ipa Payload
          ls -lh ZaloFake-unsigned.ipa

      - name: Upload file .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ZaloFake-ipa
          path: ios/build/ZaloFake-unsigned.ipa
          if-no-files-found: error
